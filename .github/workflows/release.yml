# Publishes a release when main is merged into prod: both images built from this
# repo go to GHCR tagged with the package.json version, then the git tag and the
# GitHub Release are created.
#
# Images first, tag last, so a tag always means its images exist. All in one
# workflow because a tag pushed with GITHUB_TOKEN does not trigger another one.
name: release

on:
  push:
    branches: [prod]

permissions:
  contents: read

# Never cancel: a release half-published (one image pushed, no tag) is worse
# than a second one waiting its turn.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Validate package.json version
        run: .github/scripts/release-version.sh

  images:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One image without the other is not a release.
      fail-fast: true
      matrix:
        include:
          - image: automata-mcp-web
            dockerfile: apps/web/Dockerfile
          - image: automata-mcp-telegram-bridge
            dockerfile: apps/telegram-bridge/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # GHCR image names must be lowercase; an owner name need not be.
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.0, 1.2, 1, latest and sha-<short>. A Railway template should pin the
      # major tag rather than latest: migrations run at boot and only go forward.
      # Also adds org.opencontainers.image.source, which links the package to
      # this repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag and create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
