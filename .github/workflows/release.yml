# Publishes a release when main is merged into prod: the three images built from
# this repo go to GHCR tagged with the package.json version, then the git tag and the
# GitHub Release are created.
#
# Images first, tag last, so a tag always means its images exist. All in one
# workflow because a tag pushed with GITHUB_TOKEN does not trigger another one.
name: release

on:
  push:
    branches: [prod]

permissions:
  contents: read

# Never cancel: a release half-published (one image pushed, no tag) is worse
# than a second one waiting its turn.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Validate package.json version
        run: .github/scripts/release-version.sh

  images:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One image without the others is not a release.
      fail-fast: true
      matrix:
        include:
          - image: automata-mcp-web
            dockerfile: apps/web/Dockerfile
          - image: automata-mcp-telegram-bridge
            dockerfile: apps/telegram-bridge/Dockerfile
          # Everything in one container: builds web and bridge again from
          # source, on top of Evolution's image. See docker/aio/Dockerfile.
          - image: automata-mcp-aio
            dockerfile: docker/aio/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # GHCR image names must be lowercase; an owner name need not be.
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.0, 1.2, 1, latest and sha-<short>. A Railway template should pin the
      # major tag rather than latest: migrations run at boot and only go forward.
      # Also adds org.opencontainers.image.source, which links the package to
      # this repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag and create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes

  # The official MCP Registry entry for the hosted server (server.json). After the
  # release, so a failure here leaves a complete release with a stale listing
  # rather than a listing ahead of its images. Re-running it after a fix is safe.
  #
  # The name app.getautomata/* is proved by a DNS TXT record on getautomata.app;
  # MCP_REGISTRY_DNS_KEY is the hex Ed25519 private key that record's public key
  # belongs to. GitHub OIDC login would need no secret but only grants
  # io.github.<owner>/*, a different listing. See docs/releases.md.
  mcp-registry:
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned and checksummed, like every image this repo builds on.
      - name: Install mcp-publisher
        env:
          PUBLISHER_VERSION: v1.8.1
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz

      - name: Publish server.json
        env:
          DNS_KEY: ${{ secrets.MCP_REGISTRY_DNS_KEY }}
        run: |
          if [ -z "$DNS_KEY" ]; then
            echo "::error::MCP_REGISTRY_DNS_KEY is not set; the release is published but the MCP Registry entry is not. See docs/releases.md."
            exit 1
          fi
          ./mcp-publisher login dns --domain getautomata.app --private-key "$DNS_KEY"
          ./mcp-publisher publish server.json
          ./mcp-publisher logout
