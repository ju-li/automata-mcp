# Local dev dependencies only. Nuxt is NOT here — it runs on the host via `pnpm dev`
# so you keep HMR and host-side debugging. There is deliberately no `predev` hook;
# bring these up yourself with `pnpm services:up`.
#
# PocketBase is the app's own database and is always needed. Postgres, Redis and
# Evolution exist ONLY to serve WhatsApp connections, so they sit behind the
# `whatsapp` profile: `pnpm services:up` brings up PocketBase alone, and
# `pnpm services:up:whatsapp` brings up everything. The down/logs/ps scripts pass
# `--profile whatsapp --profile telegram` unconditionally so they still cover the
# full set — a profiled service you forgot the flag for looks simply absent, which
# is the one sharp edge profiles have.
#
# The `telegram` profile runs the Telegram bridge (apps/telegram-bridge). It
# reuses the Postgres server above — its own `telegram` database and roles, never
# Evolution's — so that server is in both profiles. `pnpm services:up:telegram`.
#
# Networking, both directions:
#   Nuxt (host)      -> Evolution:  http://localhost:8080
#   Nuxt (host)      -> PocketBase: http://localhost:8090
#   Evolution (ctr)  -> Nuxt:       http://host.docker.internal:3000/api/webhook/evolution
#   Nuxt (host)      -> bridge:     http://localhost:8095
#
# Every image tag is pinned. Do not relax one to `latest`.

name: claude-whatsapp-mcp

services:
  postgres:
    image: postgres:16.15-alpine
    profiles: [whatsapp, telegram]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-evolution}
    ports:
      # Loopback only: the compose defaults are well-known, and this database
      # holds every paired account's messages.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app]

  redis:
    image: redis:8.2.9-alpine
    profiles: [whatsapp]
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app]

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    profiles: [whatsapp]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Loopback only: AUTHENTICATION_API_KEY now has a dev default, and this
      # API can read and send from every paired account.
      - '127.0.0.1:8080:8080'
    # Linux does not resolve host.docker.internal by default (macOS/Windows do).
    # Without this, Evolution cannot reach the Nuxt webhook running on the host.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      TELEMETRY_ENABLED: 'false'
      LOG_LEVEL: ERROR,WARN,INFO,LOG
      LANGUAGE: en
      DEL_INSTANCE: 'false'
      QRCODE_LIMIT: 30

      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'true'

      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-evolution}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-evolution}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'true'
      DATABASE_SAVE_MESSAGE_UPDATE: 'true'
      DATABASE_SAVE_DATA_CONTACTS: 'true'
      DATABASE_SAVE_DATA_CHATS: 'true'
      # The other DATABASE_SAVE_DATA_* flags cover live traffic. This one covers
      # the one-shot history payload WhatsApp pushes at pairing: the handler
      # checks it once and drops the whole payload if it is false.
      DATABASE_SAVE_DATA_HISTORIC: 'true'

      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: 'false'
      CACHE_LOCAL_ENABLED: 'false'

      # Off, and the app registers a **per-instance** webhook for every
      # connection instead (`registerConnectionWebhook` in server/utils/
      # instances.ts). Two reasons, and neither is a preference:
      #
      #  - The global webhook sends no custom headers, so NUXT_WEBHOOK_SECRET
      #    can never be satisfied by it. A per-instance webhook does, which is
      #    what lets the inbound route be authenticated at all.
      #  - A connection on a user's own Evolution server has no
      #    WEBHOOK_GLOBAL_URL pointing here. Only per-instance registration
      #    reaches those.
      #
      # Leaving it on would also deliver every event twice. The URL still comes
      # from WEBHOOK_URL / NUXT_WEBHOOK_URL, so dev and prod differ by config
      # only — that is now the value the app registers, not this one.
      #
      # If you turn it back on: WEBHOOK_GLOBAL_ENABLED alone delivers nothing.
      # Evolution gates every global delivery on the matching WEBHOOK_EVENTS_*
      # flag, and each defaults to false.
      WEBHOOK_GLOBAL_ENABLED: 'false'
      WEBHOOK_GLOBAL_URL: ${WEBHOOK_URL:-http://host.docker.internal:3000/api/webhook/evolution}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: 'false'
    volumes:
      - evolution_instances:/evolution/instances
    networks: [app]

  # One-shot: creates the `telegram` database and its two roles on the Postgres
  # above, as that server's superuser, then exits. Idempotent, so it runs on every
  # `up`. The bridge never sees the superuser credential.
  telegram-db-init:
    image: postgres:16.15-alpine
    profiles: [telegram]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-evolution}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATABASE: ${POSTGRES_DB:-evolution}
      # Empty defaults, not `:?` — compose interpolates every service whether its
      # profile is on or not, and a missing Telegram value must not break
      # `pnpm services:up`. db-init.sh refuses to run with either one empty.
      TELEGRAM_BRIDGE_DB_PASSWORD: ${TELEGRAM_BRIDGE_DB_PASSWORD:-}
      TELEGRAM_READER_PASSWORD: ${TELEGRAM_READER_PASSWORD:-}
    volumes:
      - ./apps/telegram-bridge/db-init.sh:/db-init.sh:ro
    entrypoint: ['sh', '/db-init.sh']
    networks: [app]

  telegram-bridge:
    build:
      context: .
      dockerfile: apps/telegram-bridge/Dockerfile
    profiles: [telegram]
    restart: unless-stopped
    depends_on:
      telegram-db-init:
        condition: service_completed_successfully
    ports:
      # Loopback only: the admin key creates sessions, and a session key can link
      # a Telegram account and will read its chats.
      - '127.0.0.1:8095:8095'
    # Same reason as Evolution: the bridge posts connection webhooks to Nuxt on
    # the host.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      TELEGRAM_BRIDGE_PORT: 8095
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_BRIDGE_ADMIN_KEY: ${TELEGRAM_BRIDGE_ADMIN_KEY:-}
      TELEGRAM_SESSION_ENCRYPTION_KEY: ${TELEGRAM_SESSION_ENCRYPTION_KEY:-}
      TELEGRAM_BRIDGE_DATABASE_URL: postgres://telegram_bridge:${TELEGRAM_BRIDGE_DB_PASSWORD:-}@postgres:5432/telegram
      TELEGRAM_TEST_SERVERS: ${TELEGRAM_TEST_SERVERS:-false}
      TELEGRAM_BACKFILL_MAX_PER_CHAT: ${TELEGRAM_BACKFILL_MAX_PER_CHAT:-2000}
      TELEGRAM_BACKFILL_DAYS: ${TELEGRAM_BACKFILL_DAYS:-365}
      TELEGRAM_BACKFILL_BROADCAST: ${TELEGRAM_BACKFILL_BROADCAST:-false}
      TELEGRAM_BACKFILL_PAGE_DELAY_MS: ${TELEGRAM_BACKFILL_PAGE_DELAY_MS:-1000}
    networks: [app]

  pocketbase:
    build:
      context: ./services/pocketbase
    restart: unless-stopped
    environment:
      # The entrypoint upserts this superuser on every boot, so a fresh clone
      # needs no manual step. Same variables the Nuxt server signs in with —
      # they have to match, so they are read from the one .env.
      NUXT_POCKETBASE_ADMIN_EMAIL: ${NUXT_POCKETBASE_ADMIN_EMAIL:?set NUXT_POCKETBASE_ADMIN_EMAIL in .env}
      NUXT_POCKETBASE_ADMIN_PASSWORD: ${NUXT_POCKETBASE_ADMIN_PASSWORD:?set NUXT_POCKETBASE_ADMIN_PASSWORD in .env}
      # SMTP, applied on every boot by pb_hooks/mail.pb.js. PocketBase is this
      # deployment's mailer — the Nuxt server has no SMTP client of its own and
      # sends disconnect alerts through it. All optional: with PB_SMTP_HOST
      # unset nothing is configured and no alert mail goes out.
      PB_SMTP_HOST: ${PB_SMTP_HOST:-}
      PB_SMTP_PORT: ${PB_SMTP_PORT:-587}
      PB_SMTP_USERNAME: ${PB_SMTP_USERNAME:-}
      PB_SMTP_PASSWORD: ${PB_SMTP_PASSWORD:-}
      PB_SMTP_TLS: ${PB_SMTP_TLS:-false}
      PB_SMTP_AUTH_METHOD: ${PB_SMTP_AUTH_METHOD:-PLAIN}
      PB_SENDER_ADDRESS: ${PB_SENDER_ADDRESS:-}
      PB_SENDER_NAME: ${PB_SENDER_NAME:-}
    ports:
      - '8090:8090'
    volumes:
      # pb_data is gitignored runtime state.
      - ./services/pocketbase/pb_data:/pb_data
      # Bind-mounted so schema changes made in the admin UI are written straight
      # back into the repo as migration files.
      - ./services/pocketbase/pb_migrations:/pb_migrations
      - ./services/pocketbase/pb_hooks:/pb_hooks
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8090/api/health']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app]

volumes:
  postgres_data:
  redis_data:
  # Deleting this volume (`docker compose down -v`) destroys every paired
  # WhatsApp session and forces a full QR re-scan. See README.
  evolution_instances:

networks:
  app:
    driver: bridge
    ipam:
      config:
        # Pinned so the firewall rule documented in the README never changes.
        # On Linux hosts running ufw (especially with ufw-docker applied),
        # container -> host traffic is dropped by default and the Evolution
        # webhook cannot reach Nuxt. See README "Linux firewall".
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1
